<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b42318">
<title>党校考试刷题 · 20 套试卷</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#1c1917; --ink2:#57534e; --muted:#8d8681;
  --red:#b42318; --red-dark:#8c1a11; --red-soft:#fdf0ee;
  --gold:#c8a24a; --green:#15803d; --green-soft:#effaf2; --green-line:#a8dfba;
  --red-soft2:#fdf1ef; --red-line:#f3c6c0;
  --line:#e9e4dc; --line2:#f1ede6;
  --shadow:0 1px 2px rgba(28,25,23,.05),0 10px 26px -12px rgba(28,25,23,.16);
  --radius:16px;
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65;
  -webkit-font-smoothing:antialiased; font-size:16px;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 420px at 12% -12%, rgba(180,35,24,.10), transparent 60%),
    radial-gradient(700px 380px at 96% 4%, rgba(200,162,74,.10), transparent 62%);
}
#app{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:22px 18px 120px}
.view{display:none; animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- brand / hero ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:50px;height:50px;border-radius:15px;flex:0 0 auto;
  background:linear-gradient(150deg,#c22a1c,#8c1a11 70%);
  color:#fdf1d8;display:grid;place-items:center;font-size:23px;font-weight:700;
  box-shadow:0 8px 18px -8px rgba(180,35,24,.75), inset 0 1px 0 rgba(255,255,255,.28);
  letter-spacing:1px;
}
.brand h1{margin:0;font-size:21px;letter-spacing:.4px;font-weight:700}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.hero-badge{
  font-size:11.5px;color:var(--red);background:var(--red-soft);
  border:1px solid #f4d5d0; padding:5px 11px;border-radius:999px;white-space:nowrap;font-weight:600
}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;line-height:1.25;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.accent b{color:var(--red)}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:15px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  padding:13px 18px;transition:transform .12s ease,box-shadow .2s ease,background .2s ease,color .2s;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.985)}
.btn-primary{
  background:linear-gradient(160deg,#c22a1c,#9a1a10);color:#fff;
  box-shadow:0 10px 22px -12px rgba(180,35,24,.9), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover{background:linear-gradient(160deg,#cb3121,#a51e13)}
.btn-light{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn-light:hover{border-color:#d9d2c8;color:var(--ink)}
.btn-block{width:100%;margin-top:14px}
.btn-lg{padding:17px 20px;font-size:16.5px;border-radius:15px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:4px}
.link:hover{color:var(--red)}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:19px;line-height:1;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:0 0 auto
}
.icon-btn:hover{color:var(--red);border-color:#e2c9c4}

/* ---------- paper grid ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.section-head h2{margin:0;font-size:15.5px;letter-spacing:.3px}
.section-head .sub{font-size:12px;color:var(--muted)}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.paper-card{
  position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 13px 12px;cursor:pointer;font:inherit;color:inherit;
  transition:transform .14s ease,border-color .2s,box-shadow .2s;box-shadow:var(--shadow);overflow:hidden
}
.paper-card:hover{transform:translateY(-2px);border-color:#e0cdc7}
.paper-card .pid{display:block;font-size:15.5px;font-weight:700;letter-spacing:.6px;font-variant-numeric:tabular-nums}
.paper-card .pmeta{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.paper-card .pmeta.done{color:var(--green);font-weight:600}
.paper-card .pmeta.pass{color:var(--green);font-weight:600}
.paper-card .pmeta.fail{color:var(--red);font-weight:600}
.paper-card.done{border-color:#d9ead9;background:linear-gradient(180deg,#fff,#f8fdf9)}
.paper-card .dot{
  position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:#ddd6cd
}
.paper-card.done .dot{background:#2f9e50}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.tb-mid{flex:1;min-width:0}
.tb-mid strong{display:block;font-size:14px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-mid span{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.topbar .btn{padding:9px 13px;font-size:13.5px;border-radius:11px}
.progress{height:5px;background:#eae4db;border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,#c22a1c,#b42318);border-radius:99px;transition:width .3s ease}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.tag{
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11.5px;
  color:var(--ink2);font-weight:600;letter-spacing:.3px
}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow)}
.stem{font-size:17px;line-height:1.85;letter-spacing:.2px;margin-bottom:6px}
.stem .ul{
  display:inline-block;min-width:70px;border-bottom:1.5px solid #b9b1a5;
  margin:0 3px;height:1.05em;vertical-align:-2px
}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  transition:border-color .16s,background .16s,transform .1s;color:inherit;font-size:15.5px;line-height:1.6
}
.opt:hover{border-color:#ddd5c9;background:#fdfcfa}
.opt:active{transform:scale(.995)}
.opt .k{
  flex:0 0 auto;width:25px;height:25px;border-radius:8px;background:#f4f0e9;color:var(--ink2);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;transition:.16s
}
.opt .t{flex:1}
.opt.picked{border-color:var(--red);background:var(--red-soft)}
.opt.picked .k{background:var(--red);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft);border-width:1.5px}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft2)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.wrong .t{text-decoration:line-through;text-decoration-color:rgba(180,35,24,.45);text-decoration-thickness:1px}
.opt[data-locked]{cursor:default}
.opt[data-locked]:hover{transform:none}
.opt[data-locked]:not(.correct):not(.wrong):not(.picked){opacity:.6}

/* fill blanks */
.blank{
  display:inline-block;min-width:96px;padding:2px 12px;margin:0 2px;border-radius:8px;
  border:1.5px dashed #d9a49d;background:#fff8f7;color:var(--red);font-size:14.5px;font-weight:600;
  cursor:pointer;text-align:center;transition:.16s;line-height:1.5
}
.blank:hover{background:#fdeeea;border-color:var(--red)}
.blank.on{
  border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green);
  font-weight:700;min-width:auto;letter-spacing:.5px;cursor:default
}
.blank.under{border-color:#e6b9b3}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.self>span{font-size:13px;color:var(--muted)}
.chip{
  font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--ink2);transition:.16s
}
.chip:hover{border-color:#d9d2c8}
.chip.ok.active{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chip.bad.active{background:var(--red-soft2);border-color:var(--red);color:var(--red)}

.feedback{margin-top:12px}
.fb{border-radius:13px;padding:13px 16px;font-size:14.5px;line-height:1.7;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--green-soft);border:1px solid var(--green-line);color:#14663a}
.fb.bad{background:var(--red-soft2);border:1px solid var(--red-line);color:#8c1a11}
.fb .ansline{display:block;margin-top:5px;font-size:13.5px;font-weight:600}
.fb b{font-weight:700}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}
.pull{flex:1}

/* ---------- sheet (question map) ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(28,25,23,.42);backdrop-filter:blur(2px);animation:fade .2s}
.sheet-body{
  position:relative;width:100%;max-width:760px;background:#fff;border-radius:22px 22px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2);
  animation:up .26s cubic-bezier(.2,.8,.3,1)
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head strong{font-size:15.5px;letter-spacing:.4px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;max-height:52vh;overflow:auto}
.map button{
  aspect-ratio:1.35;border-radius:9px;border:1px solid var(--line);background:#fbf9f6;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.14s;font-variant-numeric:tabular-nums
}
.map button.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.map button.bad{background:var(--red-soft2);border-color:var(--red-line);color:var(--red)}
.map button.cur{outline:2px solid var(--red);outline-offset:1px;background:#fff;color:var(--red)}
.map button.todo{background:#f4f0e9}

/* ---------- result ---------- */
.result-hero{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px 22px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:14px
}
.ring{width:158px;height:158px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.ring-in{position:relative;z-index:1;text-align:center;line-height:1}
.ring-in span{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring-in small{display:block;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:2px}
.verdict{font-size:19px;font-weight:700;letter-spacing:1px;margin:2px 0 4px}
.verdict.pass{color:var(--green)}
.verdict.fail{color:var(--red)}
.result-sub{font-size:13px;color:var(--muted)}
.breakdown{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.bd-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px}
.bd-row:last-child{border-bottom:none}
.bd-row .nm{width:64px;color:var(--ink2);font-size:13.5px}
.bd-row .mini{flex:1;height:6px;background:#f1ede6;border-radius:99px;overflow:hidden}
.bd-row .mini i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c22a1c,#b42318)}
.bd-row .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrong-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.wrong-head h3{margin:0;font-size:15.5px}
.wrong-list{display:flex;flex-direction:column;gap:10px}
.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.wrong-item .wi-top{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.wrong-item .wi-no{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.wrong-item .wi-stem{font-size:14.5px;line-height:1.75}
.wrong-item .wi-opts{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink2)}
.wrong-item .wi-opts .c{color:var(--green);font-weight:600}
.wrong-item .wi-opts .w{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.wrong-item .wi-ans{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;
  display:flex;gap:16px;flex-wrap:wrap
}
.wrong-item .wi-ans .lab{color:var(--muted);margin-right:4px}
.wrong-item .wi-ans .ok{color:var(--green);font-weight:700}
.wrong-item .wi-ans .no{color:var(--red);font-weight:700}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0;line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:99;
  background:rgba(28,25,23,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.3s;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:86vw
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){
  #app{padding:16px 13px 110px}
  .brand h1{font-size:19px}
  .stat b{font-size:19px}
  .qcard{padding:18px 15px}
  .stem{font-size:16px}
  .opt{font-size:15px;padding:12px 13px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= HOME ================= -->
  <section id="view-home" class="view active">
    <div class="hero">
      <div class="brand">
        <div class="logo">党</div>
        <div>
          <h1>党校考试刷题</h1>
          <p>20 套试卷 · 1200 道题 · 满分 100</p>
        </div>
      </div>
      <span class="hero-badge">60 分及格</span>
    </div>

    <div class="stats" id="stats"></div>

    <button class="btn btn-primary btn-lg" id="btn-random">
      <span>🎲</span> 随机抽一套开始
    </button>
    <p class="hint" id="random-hint">优先抽取还没刷过的试卷</p>

    <div class="section-head">
      <h2>选择试卷</h2>
      <button class="link" id="btn-reset">清空记录</button>
    </div>
    <div class="paper-grid" id="paper-grid"></div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="view-quiz" class="view">
    <div class="topbar">
      <button class="icon-btn" id="btn-exit" title="返回">←</button>
      <div class="tb-mid">
        <strong id="q-paper">试卷</strong>
        <span id="q-timer">00:00 · 已答 0/60</span>
      </div>
      <button class="btn btn-light" id="btn-card">题卡</button>
      <button class="btn btn-primary" id="btn-submit">交卷</button>
    </div>
    <div class="progress"><div class="bar" id="q-bar"></div></div>
    <div class="qmeta">
      <span class="tag" id="q-tag">填空题 · 1分</span>
      <span id="q-pos">1 / 60</span>
    </div>
    <div class="qcard" id="qcard"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav">
      <button class="btn btn-light" id="btn-prev">上一题</button>
      <button class="btn btn-primary" id="btn-next">下一题</button>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="view-result" class="view">
    <div id="result-hero"></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="wrong-head"><h3 id="wrong-title">错题回顾</h3></div>
    <div class="wrong-list" id="wrong-list"></div>
    <div class="actions" id="result-actions"></div>
    <p class="hint">成绩已自动保存，可在首页查看每套试卷的最好成绩</p>
  </section>

  <!-- ================= SHEET ================= -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-act="close-sheet"></div>
    <div class="sheet-body">
      <div class="sheet-head">
        <strong>答题卡</strong>
        <button class="link" data-act="close-sheet" style="font-size:13px">关闭</button>
      </div>
      <div class="legend">
        <span><i style="background:#2f9e50"></i>答对</span>
        <span><i style="background:#b42318"></i>答错</span>
        <span><i style="background:#f4f0e9;border:1px solid #e9e4dc"></i>未作答</span>
      </div>
      <div class="map" id="map"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>

<script>
"use strict";
/* ============ 常量 ============ */
var TYPE = {
  fill:   { name: '填空题', pts: 1, total: 10 },
  judge:  { name: '判断题', pts: 1, total: 10 },
  single: { name: '单选题', pts: 2, total: 20 },
  multi:  { name: '多选题', pts: 2, total: 20 }
};
var PASS = 60;
var LS_KEY = 'dxkt_v1';

/* ============ 工具 ============ */
function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function letter(i){ return 'ABCD'.charAt(i); }
function sortLetters(s){ return String(s||'').split('').sort().join(''); }

var toastTimer = null;
function toast(msg){
  var t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* ============ 存储 ============ */
var STORE = loadStore();
function loadStore(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return { records:{}, progress:{} };
    var o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return { records:{}, progress:{} };
    o.records = o.records || {};
    o.progress = o.progress || {};
    return o;
  } catch(e){ return { records:{}, progress:{} }; }
}
function saveStore(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(STORE)); } catch(e){}
}

/* ============ 数据索引 ============ */
var PAPERS = BANK.papers.slice().sort(function(a,b){ return a.id.localeCompare(b.id); });
var BY_ID = {};
PAPERS.forEach(function(p){ BY_ID[p.id] = p; });

/* ============ 运行态 ============ */
var S = null;      // 当前答题会话
var timerId = null;

/* ============ 首页 ============ */
function showView(name){
  ['home','quiz','result'].forEach(function(v){
    el('view-'+v).classList.toggle('active', v === name);
  });
  window.scrollTo(0, 0);
}

function renderHome(){
  var done = 0, passed = 0, sum = 0, cnt = 0, best = 0;
  PAPERS.forEach(function(p){
    var r = STORE.records[p.id];
    if (r){ done++; sum += r.last || 0; cnt++; if ((r.best||0) >= PASS) passed++; best = Math.max(best, r.best||0); }
  });
  var avg = cnt ? Math.round(sum/cnt) : 0;
  el('stats').innerHTML =
    '<div class="stat accent"><b>'+done+'<span style="font-size:13px;color:#8d8681">/20</span></b><span>已刷试卷</span></div>' +
    '<div class="stat"><b>'+avg+'</b><span>平均分</span></div>' +
    '<div class="stat"><b>'+passed+'</b><span>及格套数</span></div>';

  var grid = '';
  PAPERS.forEach(function(p){
    var r = STORE.records[p.id];
    var pr = STORE.progress[p.id];
    var cls = 'paper-card' + (r ? ' done' : '');
    var meta = '<span class="pmeta">未开始 · 60 题</span>';
    if (r){
      var pass = (r.last||0) >= PASS;
      var times = (r.attempts||1) > 1 ? ' · 第'+(r.attempts||1)+'次' : '';
      meta = '<span class="pmeta '+(pass?'pass':'fail')+'">'+(pass?'及格':'未及格')+' '+(r.last||0)+' 分 · 最好 '+(r.best||0)+times+'</span>';
    } else if (pr && pr.answers && Object.keys(pr.answers).length){
      meta = '<span class="pmeta">继续作答 · 已答 '+Object.keys(pr.answers).length+' 题</span>';
    }
    grid += '<button class="'+cls+'" data-paper="'+p.id+'">' +
              '<span class="dot"></span>' +
              '<span class="pid">试卷 '+p.id+'</span>' + meta +
            '</button>';
  });
  el('paper-grid').innerHTML = grid;

  var un = PAPERS.filter(function(p){ return !STORE.records[p.id]; }).length;
  el('random-hint').textContent = un > 0
    ? '还有 '+un+' 套试卷没刷过 · 优先抽取未刷过的'
    : '20 套全部刷过啦 · 将优先抽取练习次数最少的';
}

function pickRandom(excludeId){
  var pool = PAPERS.filter(function(p){ return p.id !== excludeId; });
  var fresh = pool.filter(function(p){ return !STORE.records[p.id]; });
  if (fresh.length){
    return fresh[Math.floor(Math.random()*fresh.length)].id;
  }
  var min = Infinity;
  pool.forEach(function(p){
    var r = STORE.records[p.id];
    var n = r ? (r.attempts||1) : 0;
    if (n < min) min = n;
  });
  var least = pool.filter(function(p){
    var r = STORE.records[p.id];
    return (r ? (r.attempts||1) : 0) === min;
  });
  if (!least.length) return null;
  return least[Math.floor(Math.random()*least.length)].id;
}

/* ============ 开始 / 恢复 ============ */
function startPaper(id, forceFresh){
  var paper = BY_ID[id];
  if (!paper) return;
  S = {
    id: id,
    paper: paper,
    idx: 0,
    answers: {},
    t0: Date.now(),
    elapsed: 0,
    submitted: false,
    result: null
  };
  var pr = STORE.progress[id];
  if (pr && pr.answers && !forceFresh){
    S.answers = pr.answers;
    S.idx = Math.min(pr.idx || 0, paper.questions.length-1);
    S.elapsed = pr.elapsed || 0;
    S.t0 = Date.now() - S.elapsed*1000;
    toast('已恢复上次作答进度');
  } else {
    delete STORE.progress[id];
    saveStore();
  }
  showView('quiz');
  renderQuiz();
  startTimer();
}

function startTimer(){
  stopTimer();
  timerId = setInterval(function(){
    if (!S || S.submitted) return;
    S.elapsed = Math.floor((Date.now() - S.t0)/1000);
    var answered = countAnswered();
    el('q-timer').textContent = fmtTime(S.elapsed) + ' · 已答 ' + answered + '/' + S.paper.questions.length;
  }, 500);
  el('q-timer').textContent = fmtTime(S.elapsed) + ' · 已答 ' + countAnswered() + '/' + S.paper.questions.length;
}
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }

function countAnswered(){
  if (!S) return 0;
  var n = 0;
  S.paper.questions.forEach(function(q){
    var a = S.answers[q.no];
    if (!a) return;
    if (q.type === 'fill'){ if (a.revealed) n++; }
    else if (a.judged) n++;
  });
  return n;
}

function saveProgress(){
  if (!S || S.submitted) return;
  S.elapsed = Math.floor((Date.now() - S.t0)/1000);
  STORE.progress[S.id] = { idx:S.idx, answers:S.answers, elapsed:S.elapsed };
  saveStore();
}

/* ============ 渲染题目 ============ */
function curQ(){ return S.paper.questions[S.idx]; }

function isAnswered(q){
  var a = S.answers[q.no];
  if (!a) return false;
  return q.type === 'fill' ? !!a.revealed : !!a.judged;
}

function renderStem(text){
  // 题干中的下划线空位：填空用可点击空，其它题型用普通下划线
  return esc(text).replace(/[_＿]{2,}/g, '<span class="ul"></span>');
}

function renderQuiz(){
  var q = curQ();
  var a = S.answers[q.no] || {};
  var meta = TYPE[q.type];
  var total = S.paper.questions.length;

  el('q-paper').textContent = '试卷 ' + S.paper.id;
  el('q-tag').textContent = meta.name + ' · ' + meta.pts + ' 分/题';
  el('q-pos').textContent = (S.idx+1) + ' / ' + total;
  el('q-bar').style.width = ((S.idx+1)/total*100) + '%';
  el('q-timer').textContent = fmtTime(S.elapsed) + ' · 已答 ' + countAnswered() + '/' + total;
  el('btn-prev').disabled = (S.idx === 0);
  el('btn-next').textContent = (S.idx === total-1) ? '完成并交卷' : '下一题';

  var html = '';
  if (q.type === 'fill'){
    var stem = esc(q.stem).replace(/[_＿]{2,}/g, function(){
      if (a.revealed){
        return '<span class="blank on">' + esc(q.answer) + '</span>';
      }
      return '<span class="blank" data-act="reveal">点击出答案</span>';
    });
    html = '<div class="stem">' + stem + '</div>';
    if (a.revealed){
      var okSelf = a.self !== false;
      html += '<div class="self"><span>这题我：</span>' +
        '<button class="chip ok' + (okSelf?' active':'') + '" data-act="self-ok">记住了 +1</button>' +
        '<button class="chip bad' + (!okSelf?' active':'') + '" data-act="self-bad">忘了</button>' +
      '</div>';
    }
  } else {
    html = '<div class="stem">' + renderStem(q.stem) + '</div><div class="opts">';
    q.options.forEach(function(text, i){
      html += optionHtml(q, a, i, text);
    });
    html += '</div>';
    if (q.type === 'multi' && !a.judged){
      var n = (a.picked || []).length;
      html += '<button class="btn btn-primary btn-block" id="btn-confirm"' + (n ? '' : ' disabled') + '>确认答案' + (n ? '（已选 '+n+' 项）' : '（至少选 2 项）') + '</button>';
    }
  }
  el('qcard').innerHTML = html;

  // 反馈区：只有「错」才显示答案；填空显示自评提示
  var fb = '';
  if (q.type === 'fill'){
    if (a.revealed){
      fb = '<div class="fb ok">答案已显示：<b>' + esc(q.answer) + '</b>' +
           '<span class="ansline" style="color:#57534e;font-weight:400">点一下空自动出答案 · 自评是否记住</span></div>';
    }
  } else if (a.judged){
    if (a.correct){
      fb = '<div class="fb ok">✓ 回答正确　<b>+' + TYPE[q.type].pts + '</b> 分</div>';
    } else {
      fb = '<div class="fb bad">✗ 回答错误　正确答案：<b>' + answerText(q) + '</b>' +
           '<span class="ansline" style="color:#57534e;font-weight:400">你的答案：' + userText(q, a) + '</span></div>';
    }
  }
  el('feedback').innerHTML = fb;
  saveProgress();
}

function optionHtml(q, a, i, text){
  var key = letter(i);
  var correctKeys = String(q.answer || '').split('');
  var picked = (a.picked || []).indexOf(key) >= 0;
  var cls = 'opt';
  if (a.judged){
    if (a.correct){
      if (picked) cls += ' correct';      // 答对时不暴露其它正确答案
    } else {
      if (correctKeys.indexOf(key) >= 0) cls += ' correct';
      if (picked && correctKeys.indexOf(key) < 0) cls += ' wrong';
      if (picked) cls += ' picked';
    }
  } else if (picked){
    cls += ' picked';
  }
  return '<button class="' + cls + '" data-act="pick" data-key="' + key + '"' +
         (a.judged ? ' data-locked="1"' : '') + '>' +
           '<span class="k">' + key + '</span><span class="t">' + esc(text) + '</span>' +
         '</button>';
}

function answerText(q){
  if (q.type === 'fill') return q.answer;
  var keys = String(q.answer || '').split('');
  var texts = keys.map(function(k){
    var i = k.charCodeAt(0) - 65;
    return k + (q.options[i] ? '. ' + q.options[i] : '');
  });
  return texts.join('　');
}

function userText(q, a){
  if (q.type === 'fill') return a.revealed ? '已查看答案' : '未作答';
  if (!a.picked || !a.picked.length) return '未作答';
  return a.picked.slice().sort().join('、');
}

/* ============ 交互 ============ */
function pickOption(key){
  var q = curQ();
  if (q.type === 'fill') return;
  var a = S.answers[q.no];
  if (a && a.judged) return;

  if (q.type === 'multi'){
    a = a || { picked: [] };
    a.picked = a.picked || [];
    var i = a.picked.indexOf(key);
    if (i >= 0) a.picked.splice(i, 1); else a.picked.push(key);
    a.picked.sort();
    S.answers[q.no] = a;
    renderQuiz();
    return;
  }

  // 单选 / 判断：选了立即判分
  a = a || {};
  a.picked = [key];
  a.judged = true;
  a.correct = (key === String(q.answer).charAt(0));
  S.answers[q.no] = a;
  renderQuiz();
}

function confirmMulti(){
  var q = curQ();
  var a = S.answers[q.no];
  if (!a || a.judged || !a.picked || !a.picked.length) return;
  a.judged = true;
  a.correct = (sortLetters(a.picked.join('')) === sortLetters(q.answer));
  renderQuiz();
}

function revealBlank(){
  var q = curQ();
  var a = S.answers[q.no] || {};
  a.revealed = true;
  if (a.self === undefined) a.self = true;
  S.answers[q.no] = a;
  renderQuiz();
}

function setSelf(ok){
  var q = curQ();
  var a = S.answers[q.no] || {};
  a.revealed = true;
  a.self = !!ok;
  S.answers[q.no] = a;
  renderQuiz();
}

function go(delta){
  var total = S.paper.questions.length;
  var next = S.idx + delta;
  if (next < 0) return;
  if (next >= total){
    if (delta > 0) submit();
    return;
  }
  S.idx = next;
  renderQuiz();
}

/* ============ 交卷 ============ */
function grade(){
  var byType = { fill:{ok:0,n:0,pts:0}, judge:{ok:0,n:0,pts:0}, single:{ok:0,n:0,pts:0}, multi:{ok:0,n:0,pts:0} };
  var score = 0, wrong = [];
  S.paper.questions.forEach(function(q){
    var a = S.answers[q.no] || {};
    var ok = false;
    if (q.type === 'fill'){
      ok = !!a.revealed && a.self !== false;
    } else {
      ok = !!a.judged && !!a.correct;
    }
    var pts = TYPE[q.type].pts;
    byType[q.type].n++;
    if (ok){
      byType[q.type].ok++;
      byType[q.type].pts += pts;
      score += pts;
    } else {
      wrong.push(q);
    }
  });
  return { score: score, byType: byType, wrong: wrong };
}

function submit(){
  var total = S.paper.questions.length;
  var unanswered = 0;
  S.paper.questions.forEach(function(q){ if (!isAnswered(q)) unanswered++; });
  if (unanswered > 0){
    var okGo = window.confirm('还有 ' + unanswered + ' 道题未作答，未作答按错误计分。确定交卷吗？');
    if (!okGo) return;
  }
  stopTimer();
  var r = grade();
  S.submitted = true;
  S.result = r;

  // 保存成绩
  var rec = STORE.records[S.id] || { attempts:0, best:0, last:0 };
  rec.attempts = (rec.attempts || 0) + 1;
  rec.last = r.score;
  rec.best = Math.max(rec.best || 0, r.score);
  rec.at = Date.now();
  STORE.records[S.id] = rec;
  delete STORE.progress[S.id];
  saveStore();

  renderResult(r);
  showView('result');
}

function renderResult(r){
  var score = r.score;
  var pass = score >= PASS;
  var secs = S.elapsed;
  var ringColor = pass ? '#15803d' : '#b42318';
  var deg = score/100*360;

  el('result-hero').innerHTML =
    '<div class="ring" style="background:conic-gradient('+ringColor+' '+deg+'deg,#f1ede6 0)">' +
      '<div class="ring-in"><span style="color:'+ringColor+'">'+score+'</span><small>分</small></div>' +
    '</div>' +
    '<div class="verdict '+(pass?'pass':'fail')+'">'+(pass?'及格':'未及格')+'</div>' +
    '<div class="result-sub">试卷 '+S.paper.id+' · 用时 '+fmtTime(secs)+' · 满分 100（及格 60）</div>';

  var order = ['fill','judge','single','multi'];
  var bd = '';
  order.forEach(function(t){
    var o = r.byType[t];
    var full = TYPE[t].total * TYPE[t].pts;
    var pct = full ? (o.pts/full*100) : 0;
    bd += '<div class="bd-row">' +
            '<span class="nm">'+TYPE[t].name+'</span>' +
            '<span class="mini"><i style="width:'+pct+'%"></i></span>' +
            '<span class="sc">'+o.ok+'/'+o.n+' 题 · '+o.pts+'/'+full+' 分</span>' +
          '</div>';
  });
  el('breakdown').innerHTML = bd;

  el('wrong-title').textContent = r.wrong.length ? ('错题回顾（'+r.wrong.length+' 题）') : '全部答对 🎉';

  var wl = '';
  r.wrong.forEach(function(q){
    var a = S.answers[q.no] || {};
    var opts = '';
    if (q.type !== 'fill' && q.options){
      opts = '<div class="wi-opts">';
      q.options.forEach(function(text, i){
        var k = letter(i);
        var isC = String(q.answer).indexOf(k) >= 0;
        var isP = (a.picked || []).indexOf(k) >= 0;
        var cls = isC ? 'c' : (isP ? 'w' : '');
        if (!isC && !isP) return;
        opts += '<span class="'+cls+'">'+k+'. '+esc(text)+'</span>';
      });
      opts += '</div>';
    }
    wl += '<div class="wrong-item">' +
            '<div class="wi-top"><span class="wi-no">第 '+q.no+' 题</span><span>' + TYPE[q.type].name + '</span></div>' +
            '<div class="wi-stem">'+renderStem(q.stem)+'</div>' + opts +
            '<div class="wi-ans">' +
              '<span><span class="lab">你的答案</span><span class="no">'+userText(q, a)+'</span></span>' +
              '<span><span class="lab">正确答案</span><span class="ok">'+esc(answerText(q))+'</span></span>' +
            '</div>' +
          '</div>';
  });
  el('wrong-list').innerHTML = wl || '<p class="hint">本套没有错题，继续保持！</p>';

  el('result-actions').innerHTML =
    '<button class="btn btn-primary btn-lg" id="btn-next-random" style="margin-top:0">🎲 随机下一套</button>' +
    '<div style="display:flex;gap:10px;margin-top:10px">' +
      '<button class="btn btn-light" id="btn-again" style="flex:1">重做本套</button>' +
      '<button class="btn btn-light" id="btn-back" style="flex:1">返回首页</button>' +
    '</div>';

  el('btn-next-random').onclick = function(){
    var nextId = pickRandom(S.id);
    if (!nextId) { toast('全部试卷都刷过了，先重做一套吧'); return; }
    startPaper(nextId, true);
  };
  el('btn-again').onclick = function(){ startPaper(S.id, true); };
  el('btn-back').onclick = function(){ goHome(); };
}

function goHome(){
  stopTimer();
  if (S && !S.submitted) saveProgress();
  S = null;
  renderHome();
  showView('home');
}

/* ============ 题卡 ============ */
function openSheet(){
  var m = '';
  S.paper.questions.forEach(function(q, i){
    var cls = '';
    if (i === S.idx) cls = 'cur';
    else if (isAnswered(q)){
      var a = S.answers[q.no];
      var ok = q.type === 'fill' ? (a.self !== false) : a.correct;
      cls = ok ? 'ok' : 'bad';
    } else cls = 'todo';
    m += '<button class="'+cls+'" data-jump="'+i+'">'+q.no+'</button>';
  });
  el('map').innerHTML = m;
  el('sheet').hidden = false;
}
function closeSheet(){ el('sheet').hidden = true; }

/* ============ 事件绑定 ============ */
el('btn-random').addEventListener('click', function(){ startPaper(pickRandom()); });
el('paper-grid').addEventListener('click', function(e){
  var b = e.target.closest('[data-paper]');
  if (b) startPaper(b.getAttribute('data-paper'));
});
el('btn-reset').addEventListener('click', function(){
  if (window.confirm('确定清空全部练习记录（含成绩与作答进度）吗？')){
    STORE = { records:{}, progress:{} };
    saveStore();
    renderHome();
    toast('记录已清空');
  }
});
el('btn-exit').addEventListener('click', function(){
  if (S && !S.submitted){
    var answered = countAnswered();
    if (answered > 0 && !window.confirm('退出后进度会自动保存，下次可继续作答。确定退出吗？')) return;
  }
  goHome();
});
el('btn-submit').addEventListener('click', function(){
  if (S && !S.submitted) submit();
});
el('btn-prev').addEventListener('click', function(){ go(-1); });
el('btn-next').addEventListener('click', function(){
  if (!S) return;
  if (S.idx === S.paper.questions.length - 1) submit();
  else go(1);
});
el('btn-card').addEventListener('click', openSheet);
el('sheet').addEventListener('click', function(e){
  if (e.target.closest('[data-act="close-sheet"]')) { closeSheet(); return; }
  var j = e.target.closest('[data-jump]');
  if (j){ S.idx = parseInt(j.getAttribute('data-jump'), 10); closeSheet(); renderQuiz(); }
});
el('qcard').addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'reveal') revealBlank();
  else if (act === 'self-ok') setSelf(true);
  else if (act === 'self-bad') setSelf(false);
  else if (act === 'pick'){
    if (t.hasAttribute('data-locked')) return;
    pickOption(t.getAttribute('data-key'));
  }
});
el('qcard').addEventListener('click', function(e){
  var c = e.target.closest('#btn-confirm');
  if (c) confirmMulti();
});

document.addEventListener('keydown', function(e){
  if (!S || S.submitted || !el('view-quiz').classList.contains('active')) return;
  if (el('sheet').hidden === false && e.key === 'Escape'){ closeSheet(); return; }
  var k = e.key.toUpperCase();
  var idx = -1;
  if ('ABCD'.indexOf(k) >= 0 && k.length === 1) idx = 'ABCD'.indexOf(k);
  else if ('1234'.indexOf(k) >= 0) idx = parseInt(k, 10) - 1;
  if (idx >= 0){
    var q = curQ();
    if (q.type !== 'fill' && q.options && idx < q.options.length){
      e.preventDefault();
      pickOption(letter(idx));
    }
    return;
  }
  if (e.key === 'Enter'){
    e.preventDefault();
    var q2 = curQ();
    var a2 = S.answers[q2.no];
    if (q2.type === 'multi' && a2 && !a2.judged && a2.picked && a2.picked.length) confirmMulti();
    else if (e.target && e.target.id === 'btn-confirm') confirmMulti();
    else go(1);
    return;
  }
  if (e.key === 'ArrowRight'){ e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  if (e.key === 'Escape'){ closeSheet(); }
});

/* ============ 启动 ============ */
renderHome();
showView('home');
</script>
</body>
</html>
